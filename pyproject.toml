[project]
name = "coldfront-allocation-blueprint"
version = "0.2.0"
description = "Plugin for ColdFront that Blueprints resource allocations."
authors = [
	{ name = "Chris Barnett" }
]
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["high-performance-computing", "resource-allocation"]
classifiers = [
    'Programming Language :: Python :: 3',
    'Framework :: Django :: 6.0',
    'Topic :: Scientific/Engineering',
    'Topic :: System :: Systems Administration',
    'Topic :: Internet :: WWW/HTTP :: WSGI :: Application',
]
dependencies = [
    "coldfront>=1.1.7,<2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest-django>=4.11.1",
    "reuse>=5.0.2",
    "ruff>=0.11.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["allocation_blueprint"]

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "allocation_blueprint.tests.settings"
testpaths = ["allocation_blueprint/tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"  # the oldest Python in requires-python

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S308", "S113"]

[tool.ruff.lint.isort]
# coldfront's imports get a section of their own, between third-party and this package's
sections = { "coldfront-main" = ["coldfront"] }
section-order = ["future", "standard-library", "third-party", "coldfront-main", "first-party", "local-folder"]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
